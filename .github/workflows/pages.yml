# Publishes four WebGL builds to GitHub Pages as one site:
#   main                                -> https://yixuan-c-zhu.github.io/Team3/
#   feature/alpha-milestone-hosting     -> https://yixuan-c-zhu.github.io/Team3/alpha/
#   feature/beta-progress-check-hosting -> https://yixuan-c-zhu.github.io/Team3/beta-progress-check2/
#   beta/feature/beta-milestone-build   -> https://yixuan-c-zhu.github.io/Team3/beta/
# Each branch serves the index.html, Build/ and TemplateData/ at its repo root.
# A push to any of these branches rebuilds the whole site from all of them, using that
# branch's copy of this file, so keep this file the same on every branch listed here.
# Requires Settings > Pages > Source set to "GitHub Actions", and each branch allowed in
# Settings > Environments > github-pages > Deployment branches.

name: Deploy web builds

on:
  push:
    branches:
      - main
      - feature/alpha-milestone-hosting
      - feature/beta-progress-check-hosting
      - beta/feature/beta-milestone-build
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          path: main
          lfs: true
          sparse-checkout: |
            index.html
            Build
            TemplateData
          sparse-checkout-cone-mode: false

      - name: Check out alpha milestone
        uses: actions/checkout@v7
        with:
          ref: feature/alpha-milestone-hosting
          path: alpha
          lfs: true
          sparse-checkout: |
            index.html
            Build
            TemplateData
          sparse-checkout-cone-mode: false

      # Skipped (not failed) until the beta branch has been pushed, so the other builds still deploy.
      - name: Check out beta progress check 2
        id: beta
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: feature/beta-progress-check-hosting
          path: beta
          lfs: true
          sparse-checkout: |
            index.html
            Build
            TemplateData
          sparse-checkout-cone-mode: false

      # Same as above: skipped (not failed) if the beta milestone branch is missing.
      - name: Check out beta milestone
        id: betamilestone
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: beta/feature/beta-milestone-build
          path: betamilestone
          lfs: true
          sparse-checkout: |
            index.html
            Build
            TemplateData
          sparse-checkout-cone-mode: false

      - name: Assemble site
        run: |
          mkdir -p _site/alpha
          cp -r main/index.html main/Build main/TemplateData _site/
          cp -r alpha/index.html alpha/Build alpha/TemplateData _site/alpha/
          if [ "${{ steps.beta.outcome }}" = "success" ]; then
            mkdir -p _site/beta-progress-check2
            cp -r beta/index.html beta/Build beta/TemplateData _site/beta-progress-check2/
          fi
          if [ "${{ steps.betamilestone.outcome }}" = "success" ]; then
            mkdir -p _site/beta
            cp -r betamilestone/index.html betamilestone/Build betamilestone/TemplateData _site/beta/
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
